name: ci

on:
  pull_request:

env:
  _R_CHECK_FORCE_SUGGESTS_: "false"

jobs:
  ci:
    strategy:
      matrix:
        include:
          - {os: macos-latest}
          - {os: ubuntu-latest}

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup
        uses: eddelbuettel/github-actions/r-ci@master
        with:
          backend: RAPT

      - name: Dependencies
        run: ./run.sh install_deps

      # Install these AFTER generic dependencies, which may select stale binaries.
      # DESCRIPTION declares the SAS crypto floor. Keep the tested,
      # immutable source pin while CRAN mirrors finish updating.
      # Disable rapt for these source installs so it cannot substitute an
      # older binary. The helper reads the floors from DESCRIPTION.
      - name: Install Matrix development dependencies
        env:
          # mx.crypto 0.2.2, with the reviewed SAS implementation.
          MX_CRYPTO_REF: "5f67d5531fec8f476f20345d70d95cfc9eaaa502"
        run: |
          Rscript -e 'install.packages(c("curl", "jsonlite"))'
          Rscript .github/install-matrix-deps.R

      # mx.crypto above builds from its vendored Rust sources using the
      # hosted runner's Rust toolchain. simplermarkdown is still needed for
      # R CMD check to recognize vignettes/e2ee.md as a vignette.
      - name: Install vignette builder
        run: Rscript -e 'install.packages("simplermarkdown")'

      - name: Test
        run: ./run.sh run_tests
        env:
          R_BUILD_ARGS: "--no-manual"
          R_CHECK_ARGS: "--no-manual --as-cran"

      - name: Check warnings and SAS coverage
        run: Rscript .github/check-results.R
