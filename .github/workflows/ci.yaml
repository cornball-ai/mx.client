name: ci

on:
  pull_request:

env:
  _R_CHECK_FORCE_SUGGESTS_: "false"

jobs:
  ci:
    strategy:
      matrix:
        include:
          - {os: macos-latest}
          - {os: ubuntu-latest}

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup
        uses: eddelbuettel/github-actions/r-ci@master
        with:
          backend: RAPT

      # The cross-signing APIs are development releases published to drat.
      # Install them before install_deps checks the hard mx.api floor. rapt
      # otherwise selects an older r2u binary by name, ignoring that floor.
      - name: Install Matrix development dependencies
        run: |
          Rscript -e 'install.packages(c("curl", "jsonlite"))'
          Rscript -e '
            if (isTRUE(getOption("rapt.enabled"))) rapt::disable()
            floors <- c("mx.api" = "0.3.0.2", "mx.crypto" = "0.2.1.1")
            utils::install.packages(names(floors),
                             repos = "https://cornball-ai.github.io/drat",
                             type = "source", dependencies = FALSE)
            for (p in names(floors)) {
              if (!requireNamespace(p, quietly = TRUE) ||
                  utils::packageVersion(p) < floors[[p]])
                stop("CI needs ", p, " >= ", floors[[p]],
                     "; publish the upstream development release to drat first")
              message(p, " ", utils::packageVersion(p))
            }'

      - name: Dependencies
        run: ./run.sh install_deps

      # mx.crypto above builds from its vendored Rust sources using the
      # hosted runner's Rust toolchain. simplermarkdown is still needed for
      # R CMD check to recognize vignettes/e2ee.md as a vignette.
      - name: Install vignette builder
        run: Rscript -e 'install.packages("simplermarkdown")'

      - name: Test
        run: ./run.sh run_tests
